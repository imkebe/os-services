# The meson cross file that builds libdrmtap for 32-bit ARM Linux (armhf)
# in Dockerfile.armhf, with Ubuntu's cross compiler and armhf libraries.
[binaries]
c = 'arm-linux-gnueabihf-gcc'
cpp = 'arm-linux-gnueabihf-g++'
ar = 'arm-linux-gnueabihf-ar'
strip = 'arm-linux-gnueabihf-strip'
# Meson 0.61 in Ubuntu 22.04 names this key pkgconfig.
pkgconfig = 'pkg-config'

[properties]
pkg_config_libdir = '/usr/lib/arm-linux-gnueabihf/pkgconfig:/usr/share/pkgconfig'

[host_machine]
system = 'linux'
cpu_family = 'arm'
cpu = 'armv7'
endian = 'little'
